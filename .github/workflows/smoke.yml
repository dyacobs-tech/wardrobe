name: Smoke test

# Boots each build in a headless iPhone-sized browser (tests/smoke.py).
# Sync/render worker calls are blocked, so no run touches real data.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to test (blank = the checked-out commit)"
        required: false
  schedule:
    - cron: "0 13 * * *"   # daily, against the live site

jobs:
  smoke:
    runs-on: ubuntu-24.04
    # Microsoft's Playwright image ships Python, Playwright and Chromium with
    # all system libraries, so nothing has to be installed per run.
    container:
      image: mcr.microsoft.com/playwright/python:v1.60.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pick target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "url=https://dyacobs-tech.github.io/wardrobe/" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.url }}" ]; then
            echo "url=${{ github.event.inputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://localhost:8000/" >> "$GITHUB_OUTPUT"
          fi
      - name: Serve this commit
        if: steps.target.outputs.url == 'http://localhost:8000/'
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
      - name: Run smoke test
        shell: bash
        run: |
          set +e
          python3 tests/smoke.py "${{ steps.target.outputs.url }}" > smoke-out.txt 2>&1
          code=$?
          cat smoke-out.txt
          if [ $code -ne 0 ]; then
            # Put the tail of the output on the run page as an annotation.
            body=$(tail -c 2500 smoke-out.txt | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "").replace("\n", "%0A"))')
            echo "::error title=Smoke test output::${body}"
          fi
          exit $code
