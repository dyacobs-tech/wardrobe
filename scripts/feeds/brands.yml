affiliates:
  # All disabled by default. Adapters skip cleanly when the env vars are unset.
  # Do not apply to any network or create accounts from this pipeline.
  - id: rakuten
    adapter: rakuten
    enabled: false
    env: [RAKUTEN_TOKEN]
  - id: cj
    adapter: cj
    enabled: false
    env: [CJ_API_KEY]
  - id: impact
    adapter: impact
    enabled: false
    env: [IMPACT_SID, IMPACT_TOKEN]
  - id: awin
    adapter: awin
    enabled: false
    env: [AWIN_API_KEY, AWIN_PUBLISHER_ID]
  - id: partnerize
    adapter: partnerize
    enabled: false
    env: [PARTNERIZE_USER_KEY, PARTNERIZE_API_KEY]
    note: "Mr Porter, SSENSE and Farfetch US programmes. Not applied."
  - id: shopstyle
    adapter: aggregator
    network: shopstyle
    enabled: false
    env: [SHOPSTYLE_API_KEY]
  - id: skimlinks
    adapter: aggregator
    network: skimlinks
    enabled: false
    env: [SKIMLINKS_API_KEY, SKIMLINKS_PUBLISHER_ID]
  - id: generic_csv
    adapter: csv_xml
    enabled: false
    # No credentials. Point at a local or URL feed when enabling:
    # feed: /path/or/https://example.com/feed.csv
