# Curated Shopify sources for The Edit.
# Only stores with verified public /products.json?limit=250&page=N are enabled.
# Re-run scripts/feeds/shopify_pull.py --probe to refresh the verified flag.
# Affiliate networks are listed under `affiliates` and stay disabled until
# credentials exist in the environment — never commit tokens.

shopify:
  delay_seconds: 3.0          # polite pause between page requests
  store_delay_seconds: 5.0    # pause between stores
  page_limit: 8
  user_agent: "DonnaCatalogBot/1.0 (+https://dyacobs-tech.github.io/wardrobe/; catalog research)"
  respect_robots: true
